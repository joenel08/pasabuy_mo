name: pasabuy_mo
description: PasaBuy Mo, Pasaya Mo
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # MVC / state
  provider: ^6.1.2

  # HTTP + storage
  dio: ^5.7.0
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.6.2

  # Forms & utils
  intl: ^0.20.3
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  fluttertoast: ^9.0.0

  # ID OCR (auto-fill for KYC step)
  google_mlkit_text_recognition: ^0.13.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  fl_chart: ^0.69.2

  flutter_localizations:
    sdk: flutter
  
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/